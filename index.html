<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4BBCF4">
<title>ファルダゴ ストーリー</title>
<style>
:root{
  --boxh:28%;
  --bounty:#4BBCF4;
  --seagreen:#61C0BF;
  --oceana:#BBDED6;
  --rosada:#FFB6B9;
  --pinksalt:#FAE3D9;
  --ink:#34505a;
  --deep:#2b7f7e;
  --tagtxt:#FFB6B9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0d0f;overflow:hidden}
body{font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#2a3140}

/* 背景（2枚でクロスフェード） */
.bg{position:absolute;inset:0;background:#2a3140 center/cover no-repeat;opacity:0;transition:opacity .7s ease}
.bg.show{opacity:1}

/* 立ち絵 */
#chars{position:absolute;left:0;right:0;top:0;bottom:var(--boxh);z-index:2;pointer-events:none}
.slot{position:absolute;bottom:-9%;height:72%;width:68%;opacity:0;transform-origin:50% 100%;
  transition:opacity .35s ease,transform .3s ease,filter .3s ease}
.slot.left{left:-8%}
.slot.right{right:-8%}
.slot.on{opacity:1}
.slot.speak{transform:scale(1.06);filter:none;z-index:3}
.slot.quiet{transform:scale(.93);filter:brightness(.6) saturate(.55);z-index:2}
.slot .fx{width:100%;height:100%}
.slot img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;-webkit-user-drag:none}
.fx.jump{animation:jump .45s ease}
.fx.shake{animation:shake .45s ease}
.fx.pop{animation:pop .25s ease}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-7%)}60%{transform:translateY(0)}80%{transform:translateY(-2%)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4%)}40%{transform:translateX(4%)}60%{transform:translateX(-3%)}80%{transform:translateX(2%)}}
@keyframes pop{0%{transform:scale(.98)}100%{transform:scale(1)}}

/* テキスト帯（画面下に貼り付き＋上辺の波線） */
#box{--boxbg:#ffffff;position:absolute;left:0;right:0;bottom:0;height:var(--boxh);z-index:5;
  padding:34px 24px calc(18px + env(safe-area-inset-bottom));background:var(--boxbg) url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2264%22%3E%3Cpath%20d%3D%22M10%208Q10%2012%2014%2012Q10%2012%2010%2016Q10%2012%206%2012Q10%2012%2010%208Z%22%20fill%3D%22%2361C0BF%22%20opacity%3D%220.28%22/%3E%3Cpath%20d%3D%22M44%2035Q44%2038%2047%2038Q44%2038%2044%2041Q44%2038%2041%2038Q44%2038%2044%2035Z%22%20fill%3D%22%23FFB6B9%22%20opacity%3D%220.38%22/%3E%3Cpath%20d%3D%22M26%2051.5Q26%2054%2028.5%2054Q26%2054%2026%2056.5Q26%2054%2023.5%2054Q26%2054%2026%2051.5Z%22%20fill%3D%22%234BBCF4%22%20opacity%3D%220.28%22/%3E%3Ccircle%20cx%3D%2254%22%20cy%3D%2210%22%20r%3D%221%22%20fill%3D%22%2361C0BF%22%20opacity%3D%22.22%22/%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%2226%22%20r%3D%22.9%22%20fill%3D%22%234BBCF4%22%20opacity%3D%22.2%22/%3E%3Ccircle%20cx%3D%226%22%20cy%3D%2240%22%20r%3D%22.9%22%20fill%3D%22%23FFB6B9%22%20opacity%3D%22.3%22/%3E%3C/svg%3E") 0 0/64px 64px;transition:background-color .3s ease}
#box.narr{--boxbg:#BBDED6;background-color:var(--boxbg)}
#box .wave{position:absolute;left:0;right:0;top:-22px;width:100%;height:26px;display:block;overflow:visible}
#box .wave .fill{fill:var(--boxbg);transition:fill .3s ease}
#box .wave .thick{fill:none;stroke:var(--seagreen);stroke-width:4}
#box .wave .thin{fill:none;stroke:var(--bounty);stroke-width:1}
#name{position:absolute;top:-17px;left:20px;background:#fff;color:var(--deep);font-weight:800;
  font-size:17px;letter-spacing:.08em;padding:5px 18px 5px 30px;border-radius:999px;
  box-shadow:0 3px 10px rgba(30,60,80,.2);border:2px solid var(--seagreen);transition:opacity .2s}
#name::before{content:"";position:absolute;left:12px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--rosada)}
#name.right{left:auto;right:20px;padding:5px 30px 5px 18px;border-color:var(--bounty)}
#name.right::before{left:auto;right:12px;background:var(--bounty)}
#name.hide{opacity:0}
#text{font-size:16.5px;line-height:1.8;white-space:pre-wrap;word-break:break-all;min-height:3em;color:var(--ink)}
#text.narr{color:#2f5f5c;letter-spacing:.04em}
#next{position:absolute;right:18px;bottom:calc(14px + env(safe-area-inset-bottom));width:26px;height:26px;border-radius:50%;background:var(--seagreen);
  color:#fff;font-size:11px;line-height:26px;text-align:center;opacity:0;box-shadow:0 2px 6px rgba(30,60,80,.25)}
#next.on{opacity:1;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(3px)}}

/* 上部ボタン */
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:7;display:flex;gap:6px}
#hud button{background:rgba(255,255,255,.78);color:var(--deep);border:1px solid rgba(255,255,255,.9);border-radius:999px;
  padding:5px 13px;font-size:12px;font-weight:700;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(30,60,80,.18)}
#hud button.on{background:var(--rosada);color:#5a2e30}

/* 選択肢（番号付きの角丸カード） */
#choices{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;justify-content:flex-end;align-items:center;
  gap:10px;padding:0 20px;background:rgba(24,58,72,.42);animation:fade .25s ease}
#choices.on{display:flex}
#choices::after{content:"";flex:0 0 calc(var(--boxh) + 14px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.choice{position:relative;width:100%;max-width:420px;min-height:54px;padding:14px 20px;border-radius:16px;
  background:rgba(255,255,255,.95);border:none;border-left:6px solid var(--seagreen);
  box-shadow:0 6px 18px rgba(20,50,70,.25);font-size:16px;color:var(--ink);text-align:left;line-height:1.45;
  animation:rise .3s ease both}
.choice:nth-child(even){border-left-color:var(--rosada)}
.choice:nth-child(2){animation-delay:.05s}.choice:nth-child(3){animation-delay:.1s}.choice:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.choice:active{transform:scale(.98);background:var(--pinksalt)}

/* 汎用オーバーレイ */
.panel{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 22px;background:rgba(22,50,62,.88);color:#fff;text-align:center;overflow:auto}
.panel.on{display:flex}
.btn{display:block;width:100%;max-width:320px;margin:7px auto;padding:13px 16px;border-radius:12px;border:none;
  background:#f1f1ee;color:#222;font-weight:700;font-size:15px}
.btn.sub{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);font-weight:500}
.btn.yel{background:var(--rosada);color:#4a2628}
.btn:active{transform:scale(.98)}

/* タイトル */
#title{background:#1c2230 url("images/bg/beach_evening.svg") center/cover;justify-content:flex-start;padding-top:12vh}
#title::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,60,80,.15),rgba(22,50,62,.9) 62%)}
#title > *{position:relative}
.logo{font-size:34px;font-weight:900;letter-spacing:.08em;line-height:1.25;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.5)}
.logo small{display:block;font-size:13px;letter-spacing:.3em;color:var(--rosada);margin-bottom:6px}
#list{width:100%;max-width:360px;margin-top:28px}
.scn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:12px 12px 6px;margin-bottom:12px;text-align:left}
.scn h3{font-size:16px;margin-bottom:2px}
.scn p{font-size:12px;opacity:.8;margin-bottom:6px}
.scn .row{display:flex;gap:8px}
.scn .row .btn{margin:6px 0;padding:10px}
.note{font-size:12px;opacity:.75;line-height:1.6;max-width:340px;margin:8px auto}
#tools{width:100%;max-width:360px;margin-top:8px}

/* ログ */
#log{justify-content:flex-start;text-align:left}
#logList{width:100%;max-width:420px;flex:1;overflow:auto;padding:8px 2px 16px}
.lg{padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px;line-height:1.6}
.lg b{display:block;color:var(--oceana);font-size:12px}
.lg.sel{color:#9fd8ff}
#log h2,#menu h2,#end h2{font-size:18px;margin-bottom:10px}

#toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.8);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:13px;display:none;max-width:86%}
</style>
</head>
<body>
<div id="app">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>

  <div id="chars">
    <div class="slot left" id="slotL"><div class="fx"><img alt=""></div></div>
    <div class="slot right" id="slotR"><div class="fx"><img alt=""></div></div>
  </div>

  <div id="box">
    <svg class="wave" viewBox="0 0 400 26" preserveAspectRatio="none" aria-hidden="true">
      <path class="fill" d="M0 14 C70 5 140 5 210 13 S330 22 400 10 L400 26 L0 26 Z"/>
      <path class="thick" d="M0 14 C70 5 140 5 210 13 S330 22 400 10" vector-effect="non-scaling-stroke"/>
      <path class="thin" d="M0 7 C80 19 150 21 225 12 S345 3 400 17" vector-effect="non-scaling-stroke"/>
    </svg>
    <div id="name" class="hide"></div>
    <div id="text"></div>
    <div id="next">▶</div>
  </div>

  <div id="hud">
    <button id="bLog">ログ</button>
    <button id="bAuto">オート</button>
    <button id="bMenu">≡</button>
  </div>

  <div id="choices"></div>

  <!-- タイトル -->
  <div class="panel on" id="title">
    <div class="logo"><small>FALDAGO STORY</small>ファルダゴ<br>ストーリー</div>
    <div id="list"></div>
    <div id="tools">
      <button class="btn sub" id="bOpen">シナリオファイル（.json）を開く</button>
      <a class="btn sub" href="editor.html" style="text-decoration:none">シナリオエディタ</a>
    </div>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>

  <!-- メニュー -->
  <div class="panel" id="menu">
    <h2>メニュー</h2>
    <button class="btn" data-act="close">ゲームに戻る</button>
    <button class="btn sub" data-act="restart">最初から</button>
    <button class="btn sub" data-act="title">タイトルへ</button>
  </div>

  <!-- ログ -->
  <div class="panel" id="log">
    <h2>ログ</h2>
    <div id="logList"></div>
    <button class="btn" data-act="close">閉じる</button>
  </div>

  <!-- おわり -->
  <div class="panel" id="end">
    <h2>おわり</h2>
    <p class="note" id="endNote"></p>
    <button class="btn yel" data-act="restart">もう一度</button>
    <button class="btn sub" data-act="title">タイトルへ</button>
  </div>

  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';
const LS = 'fstory_';
const FORMAT = 'faldago-story';
const $ = s => document.querySelector(s);
const app = $('#app');

/* ---------- 状態 ---------- */
let S = null;          // シナリオ
let key = '';          // セーブ用キー
let isPreview = false;
let labels = {}, chars = {}, bgs = {};
let st = null;         // {i, bg, slots:{left,right}, speaker}
let logs = [];
let typing = null, full = '', waiting = false, busy = false;
let auto = false, autoTimer = null;
let curBgEl = $('#bgA'), bgSrc = '';

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(LS + k)); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(LS + k); } catch(e){} }
};

function toast(msg, ms = 2400){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms);
}

/* ---------- 仮画像（画像が見つからない時の代わり） ---------- */
function fallbackImg(label){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760"><path d="M40 760 Q44 560 200 500 Q356 560 360 760Z" fill="#888" opacity=".7"/><ellipse cx="200" cy="310" rx="112" ry="120" fill="#999" opacity=".7"/><text x="200" y="660" font-size="26" fill="#fff" text-anchor="middle" font-family="sans-serif">${String(label).replace(/[<&>]/g,'')}</text><text x="200" y="694" font-size="18" fill="#eee" text-anchor="middle" font-family="sans-serif">画像が見つかりません</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ---------- シナリオ読込 ---------- */
function prepare(scn){
  if (!scn || scn.format !== FORMAT || !Array.isArray(scn.steps)) throw new Error('シナリオ形式が正しくありません');
  S = scn; labels = {}; chars = {}; bgs = {};
  (scn.characters || []).forEach(c => {
    const ex = {}; (c.expressions || []).forEach(e => ex[e.key] = e);
    chars[c.id] = { ...c, ex };
  });
  (scn.backgrounds || []).forEach(b => bgs[b.id] = b);
  scn.steps.forEach((s, i) => { if (s.type === 'label' && s.name) labels[s.name] = i; });
  // 先読み
  const urls = new Set();
  Object.values(chars).forEach(c => Object.values(c.ex).forEach(e => e.src && urls.add(e.src)));
  Object.values(bgs).forEach(b => b.src && urls.add(b.src));
  urls.forEach(u => { const im = new Image(); im.src = u; });
}

function exprSrc(who, expr){
  const c = chars[who]; if (!c) return fallbackImg(who);
  const e = c.ex[expr] || c.ex.normal || Object.values(c.ex)[0];
  return e && e.src ? e.src : fallbackImg(c.name);
}

/* ---------- 描画 ---------- */
function setBg(id, instant){
  const b = bgs[id];
  const src = b ? b.src : '';
  if (src === bgSrc) return;
  bgSrc = src;
  const other = curBgEl.id === 'bgA' ? $('#bgB') : $('#bgA');
  other.style.backgroundImage = src ? `url("${src}")` : 'none';
  if (instant){ other.style.transition = 'none'; curBgEl.style.transition = 'none'; }
  other.classList.add('show'); curBgEl.classList.remove('show');
  if (instant){ void other.offsetWidth; other.style.transition = ''; curBgEl.style.transition = ''; }
  curBgEl = other;
}

const slotEl = { left: $('#slotL'), right: $('#slotR') };
function renderChars(effect){
  ['left','right'].forEach(pos => {
    const el = slotEl[pos], d = st.slots[pos], img = el.querySelector('img'), fx = el.querySelector('.fx');
    el.classList.remove('speak','quiet');
    if (!d){ el.classList.remove('on'); el.dataset.key = ''; return; }
    const src = exprSrc(d.who, d.expr);
    const k = d.who + '/' + d.expr;
    if (el.dataset.key !== k){
      const changedSame = el.dataset.key && el.dataset.key.split('/')[0] === d.who;
      img.onerror = () => { img.onerror = null; img.src = fallbackImg((chars[d.who]||{}).name || d.who); };
      img.src = src; el.dataset.key = k;
      if (changedSame){ fx.classList.remove('pop'); void fx.offsetWidth; fx.classList.add('pop'); }
    }
    el.classList.add('on');
    el.classList.add(st.speaker === pos ? 'speak' : 'quiet');
    if (effect && st.speaker === pos && effect !== 'none'){
      fx.classList.remove('jump','shake'); void fx.offsetWidth; fx.classList.add(effect);
    }
  });
}

function place(who, expr, pos){
  if (!who) return;
  pos = pos === 'right' ? 'right' : (pos === 'left' ? 'left' : null);
  if (!pos){ // 位置指定なし → すでに出ていればそこ、なければ左
    pos = st.slots.right && st.slots.right.who === who ? 'right' : (st.slots.left && st.slots.left.who === who ? 'left' : (st.slots.left ? 'right' : 'left'));
  }
  const other = pos === 'left' ? 'right' : 'left';
  if (st.slots[other] && st.slots[other].who === who) st.slots[other] = null;
  const prev = st.slots[pos];
  st.slots[pos] = { who, expr: expr || (prev && prev.who === who ? prev.expr : 'normal') };
  return pos;
}

function hide(pos){
  if (pos === 'both' || !pos){ st.slots.left = null; st.slots.right = null; }
  else st.slots[pos] = null;
}

/* ---------- テキスト ---------- */
function showText(name, text, pos){
  const nm = $('#name'), tx = $('#text');
  if (name){ nm.textContent = name; nm.className = pos === 'right' ? 'right' : ''; tx.className = ''; }
  else { nm.className = 'hide'; tx.className = 'narr'; }
  $('#box').classList.toggle('narr', !name);
  full = String(text || ''); tx.textContent = '';
  $('#next').classList.remove('on'); waiting = false;
  logs.push({ name: name || '', text: full });
  if (logs.length > 300) logs.shift();
  let n = 0;
  clearInterval(typing);
  typing = setInterval(() => {
    n += 1; tx.textContent = full.slice(0, n);
    if (n >= full.length) finishTyping();
  }, 32);
}
function finishTyping(){
  clearInterval(typing); typing = null;
  $('#text').textContent = full; waiting = true; $('#next').classList.add('on');
  if (auto){ clearTimeout(autoTimer); autoTimer = setTimeout(() => { if (waiting && auto) next(); }, 1300 + full.length * 45); }
}

/* ---------- 進行 ---------- */
function charName(who){ return (chars[who] && chars[who].name) || who || ''; }

function jump(label){
  if (labels[label] === undefined){ toast(`ジャンプ先「${label}」が見つかりません`); return false; }
  st.i = labels[label]; return true;
}

function save(at){
  if (!key) return;
  store.set('save_' + key, { i: at, bg: st.bg, slots: st.slots, t: Date.now() });
}

function next(){
  if (!S) return;
  clearTimeout(autoTimer);
  waiting = false;
  let guard = 0;
  while (st.i < S.steps.length){
    if (++guard > 5000){ toast('ジャンプが無限ループしています'); return; }
    const at = st.i, s = S.steps[st.i++] || {};
    switch (s.type){
      case 'label': continue;
      case 'goto': if (!jump(s.label)) return finish(); continue;
      case 'bg':
        st.bg = s.bg; setBg(s.bg);
        if (s.clear){ hide('both'); st.speaker = null; renderChars(); }
        continue;
      case 'show': { place(s.who, s.expr, s.pos); renderChars(); continue; }
      case 'hide': hide(s.pos); renderChars(); continue;
      case 'say': {
        const pos = place(s.who, s.expr, s.pos);
        st.speaker = pos; renderChars(s.effect);
        showText(s.name || charName(s.who), s.text, pos);
        save(at); return;
      }
      case 'narration':
        st.speaker = null; renderChars();
        showText('', s.text); save(at); return;
      case 'choice':
        save(at); showChoices(s.options || []); return;
      case 'end': return finish();
      default: continue;
    }
  }
  finish();
}

function showChoices(opts){
  const box = $('#choices'); box.innerHTML = '';
  if (auto) toggleAuto(false);
  opts.filter(o => o && o.text).forEach(o => {
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = o.text;
    b.onclick = ev => {
      ev.stopPropagation();
      box.classList.remove('on');
      logs.push({ name: '選択', text: o.text, sel: true });
      if (o.goto && !jump(o.goto)) return finish();
      next();
    };
    box.appendChild(b);
  });
  box.classList.add('on');
}

function finish(){
  clearInterval(typing); clearTimeout(autoTimer); auto = false; $('#bAuto').classList.remove('on');
  if (key) store.del('save_' + key);
  $('#endNote').textContent = (S && S.title ? `「${S.title}」` : '') + (isPreview ? '（テストプレイ）' : '');
  open('#end');
}

/* ---------- 開始 ---------- */
function resetStage(){
  st = { i: 0, bg: null, slots: { left: null, right: null }, speaker: null };
  logs = []; bgSrc = '__';
  $('#choices').classList.remove('on');
  ['left','right'].forEach(p => { slotEl[p].classList.remove('on','speak','quiet'); slotEl[p].dataset.key = ''; });
  $('#text').textContent = ''; $('#name').className = 'hide'; $('#next').classList.remove('on');
}

// from までのステップを（分岐を無視して）なぞり、背景と立ち絵の状態だけ再現する
function simulateTo(from){
  for (let i = 0; i < from && i < S.steps.length; i++){
    const s = S.steps[i];
    if (s.type === 'bg'){ st.bg = s.bg; if (s.clear) hide('both'); }
    else if (s.type === 'show' || s.type === 'say') place(s.who, s.expr, s.pos);
    else if (s.type === 'hide') hide(s.pos);
  }
  st.i = from;
}

function start(opt = {}){
  resetStage();
  if (opt.resume){ st.i = opt.resume.i; st.bg = opt.resume.bg; st.slots = opt.resume.slots || st.slots; }
  else if (opt.from) simulateTo(opt.from);
  setBg(st.bg, true);
  renderChars();
  closeAll();
  next();
}

/* ---------- パネル ---------- */
function open(sel){ closeAll(); $(sel).classList.add('on'); }
function closeAll(){ document.querySelectorAll('.panel').forEach(p => p.classList.remove('on')); }
function toTitle(){
  clearInterval(typing); clearTimeout(autoTimer); auto = false; $('#bAuto').classList.remove('on');
  if (isPreview){ history.replaceState(null, '', location.pathname); isPreview = false; }
  S = null; key = ''; buildTitle(); open('#title');
}

document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', ev => {
  ev.stopPropagation();
  const a = b.dataset.act;
  if (a === 'close') closeAll();
  else if (a === 'restart'){ if (key) store.del('save_' + key); start(); }
  else if (a === 'title') toTitle();
}));

$('#bMenu').onclick = ev => { ev.stopPropagation(); if (S) open('#menu'); };
$('#bLog').onclick = ev => {
  ev.stopPropagation(); if (!S) return;
  const l = $('#logList'); l.innerHTML = '';
  logs.forEach(g => {
    const d = document.createElement('div'); d.className = 'lg' + (g.sel ? ' sel' : '');
    if (g.name){ const b = document.createElement('b'); b.textContent = g.name; d.appendChild(b); }
    d.appendChild(document.createTextNode(g.sel ? '▶ ' + g.text : g.text));
    l.appendChild(d);
  });
  open('#log'); l.scrollTop = l.scrollHeight;
};
function toggleAuto(v){
  auto = v === undefined ? !auto : v;
  $('#bAuto').classList.toggle('on', auto);
  if (auto && waiting){ clearTimeout(autoTimer); autoTimer = setTimeout(() => { if (waiting && auto) next(); }, 600); }
}
$('#bAuto').onclick = ev => { ev.stopPropagation(); if (S) toggleAuto(); };

// 画面タップで送る
app.addEventListener('click', ev => {
  if (!S || ev.target.closest('.panel,#hud,#choices')) return;
  if (typing){ finishTyping(); return; }
  if (waiting) next();
});
document.addEventListener('keydown', ev => {
  if (!S || document.querySelector('.panel.on') || $('#choices').classList.contains('on')) return;
  if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); if (typing) finishTyping(); else if (waiting) next(); }
});

/* ---------- タイトル画面 ---------- */
async function fetchJSON(url){
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function buildTitle(){
  const list = $('#list'); list.innerHTML = '<p class="note">読み込み中…</p>';
  let files = [];
  try { files = await fetchJSON('scenarios/index.json'); }
  catch(e){
    list.innerHTML = '<p class="note">シナリオ一覧を読めませんでした。<br>ファイルを直接開いている場合はこの表示になります。下の「シナリオファイルを開く」から選んでください。</p>';
    return;
  }
  list.innerHTML = '';
  for (const f of files){
    const file = typeof f === 'string' ? f : f.file;
    try {
      const scn = await fetchJSON('scenarios/' + file);
      addScenarioCard(scn, 'file:' + file);
    } catch(e){
      const p = document.createElement('p'); p.className = 'note'; p.textContent = `${file} を読み込めませんでした`; list.appendChild(p);
    }
  }
  if (!files.length) list.innerHTML = '<p class="note">シナリオがまだありません。</p>';
}

function addScenarioCard(scn, k){
  const card = document.createElement('div'); card.className = 'scn';
  const h = document.createElement('h3'); h.textContent = scn.title || '無題のシナリオ';
  const p = document.createElement('p'); p.textContent = scn.description || '';
  const row = document.createElement('div'); row.className = 'row';
  const b1 = document.createElement('button'); b1.className = 'btn yel'; b1.textContent = 'はじめから';
  b1.onclick = () => { try { prepare(scn); } catch(e){ return toast(e.message); } key = k; store.del('save_' + k); start(); };
  row.appendChild(b1);
  const sv = store.get('save_' + k);
  if (sv){
    const b2 = document.createElement('button'); b2.className = 'btn'; b2.textContent = 'つづきから';
    b2.onclick = () => { try { prepare(scn); } catch(e){ return toast(e.message); } key = k; start({ resume: sv }); };
    row.appendChild(b2);
  }
  card.append(h, p, row);
  $('#list').appendChild(card);
}

$('#bOpen').onclick = () => $('#file').click();
$('#file').onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const scn = JSON.parse(rd.result); prepare(scn);
      key = 'local:' + (scn.title || f.name);
      const sv = store.get('save_' + key);
      if (sv && confirm('前回のつづきから再生しますか？\n（キャンセルで最初から）')) start({ resume: sv });
      else start();
    } catch(e){ toast('読み込めませんでした：' + e.message); }
    ev.target.value = '';
  };
  rd.readAsText(f);
};

/* ---------- 起動 ---------- */
const q = new URLSearchParams(location.search);
if (q.get('preview')){
  const scn = store.get('preview');
  try {
    prepare(scn); isPreview = true; key = '';
    start({ from: Math.max(0, parseInt(q.get('from') || '0', 10) || 0) });
  } catch(e){ toast('テストプレイ用のデータがありません'); buildTitle(); }
} else {
  buildTitle();
}
})();
</script>
